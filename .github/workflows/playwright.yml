name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      # Pinned to 16 because the tree is pinned: pnpm-lock.yaml is
      # lockfileVersion 5.3, which only pnpm 6 reads, and pnpm 6's fetcher
      # fails every tarball GET against pkg.hanzo.ai on newer Node
      # (ERR_INVALID_THIS). Moving off 16 means regenerating the lockfile on a
      # current pnpm, which is a dependency change, not a CI one.
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      # No pinned pnpm version: action-setup reads packageManager (6.32.11).
      # The old job installed pnpm@5.3 against a lockfile written for 6.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Browsers only. --with-deps asks apt for the package names the pinned
      # Playwright knew -- libicu70, libffi7, libx264-163 -- which are Ubuntu
      # 22.04's; the runner image is 24.04 and carries the 74/8/164 versions,
      # so the install exits 100 before a browser is fetched.
      - run: pnpm exec playwright install
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
